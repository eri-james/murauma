#:schema node_modules/wrangler/config-schema.json
name = "murauma"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages project config
# The "main" field is not needed for Pages — functions are auto-discovered
# from the /functions directory.

# ============================================================
# D1 DATABASE
# ============================================================
# After running `npx wrangler d1 create murauma-db`, paste the
# database_id here. The binding name "DB" is what the Worker
# functions use via context.env.DB.

[[d1_databases]]
binding = "DB"
database_name = "murauma-db"
database_id = "4919fadc-6878-4b79-a885-853f388bb31c"

# ============================================================
# SECRETS (set via Cloudflare Dashboard → Workers → Pages → murauma → Settings → Environment variables)
# ============================================================
# HCAPTCHA_SECRET — hCaptcha secret key for server-side verification
#   Set in Cloudflare dashboard under Pages > murauma > Settings > Environment variables
#   Accessed in Workers via context.env.HCAPTCHA_SECRET
