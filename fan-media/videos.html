<body class="has-pill-nav">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>

    <!-- =================================================================== -->
    <!-- FOOTER SECTION -->
    <!-- =================================================================== -->

    <!-- =================================================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- =================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('video-gallery');
            const loadingMessage = document.getElementById('loading-message');

            /**
             * Extracts YouTube video ID from various URL formats.
             * Supports: youtube.com/watch?v=ID, youtu.be/ID, youtube.com/embed/ID
             */
            function extractYouTubeId(url) {
                try {
                    const u = new URL(url);
                    // youtube.com/watch?v=ID
                    if (u.hostname.includes('youtube.com') && u.searchParams.get('v')) {
                        return u.searchParams.get('v');
                    }
                    // youtu.be/ID
                    if (u.hostname === 'youtu.be') {
                        return u.pathname.slice(1).split('/')[0].split('?')[0];
                    }
                    // youtube.com/embed/ID
                    if (u.hostname.includes('youtube.com') && u.pathname.startsWith('/embed/')) {
                        return u.pathname.split('/')[2]?.split('?')[0];
                    }
                } catch {}
                return null;
            }

            const fetchVideos = async () => {
                try {
                    const response = await fetch('/api/fan-media?type=video');
                    if (!response.ok) throw new Error('Failed to load videos.');
                    const data = await response.json();
                    if (data.result !== 'success') throw new Error(data.message);

                    const items = data.items || [];
                    if (items.length === 0) {
                        loadingMessage.textContent = 'No videos have been submitted yet. Be the first to share your video!';
                        return;
                    }

                    gallery.innerHTML = '';

                    items.forEach(item => {
                        const safeTitle = DOMPurify.sanitize(item.title);
                        const safeAuthor = DOMPurify.sanitize(item.author);
                        const safeDesc = DOMPurify.sanitize(item.description);
                        const ytId = extractYouTubeId(item.url);

                        const card = document.createElement('div');
                        card.className = 'rounded-lg overflow-hidden shadow-lg bg-gray-100';

                        if (ytId) {
                            // YouTube embed
                            card.innerHTML = `
                                <div class="video-embed-container">
                                    <iframe src="https://www.youtube.com/embed/${ytId}" title="${safeTitle}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                                </div>
                                <div class="p-4 bg-gray-50">
                                    <h3 class="font-bold text-lg text-gray-800 truncate">${safeTitle}</h3>
                                    <p class="text-sm text-gray-500">by ${safeAuthor}</p>
                                    ${safeDesc ? `<p class="text-xs text-gray-400 mt-1 line-clamp-2">${safeDesc}</p>` : ''}
                                </div>
                            `;
                        } else {
                            // Link card for non-YouTube videos
                            card.innerHTML = `
                                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="block">
                                    <div class="relative aspect-video bg-gradient-to-br from-red-100 to-red-200 flex items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    </div>
                                </a>
                                <div class="p-4 bg-gray-50">
                                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-bold text-lg text-gray-800 hover:text-red-600 truncate block">${safeTitle}</a>
                                    <p class="text-sm text-gray-500">by ${safeAuthor}</p>
                                    ${safeDesc ? `<p class="text-xs text-gray-400 mt-1 line-clamp-2">${safeDesc}</p>` : ''}
                                </div>
                            `;
                        }

                        gallery.appendChild(card);
                    });

                } catch (error) {
                    console.error('Error fetching videos:', error);
                    loadingMessage.textContent = 'Could not load videos. Please try again later.';
                    loadingMessage.classList.add('text-red-500');
                }
            };

            fetchVideos();
        });
    </script>
