<body class="has-pill-nav">

        <div class="bg-white p-6 md:p-12 rounded-lg shadow-md border-2 border-yellow-400">
            <!-- Page Header -->
            <div class="flex justify-between items-center mb-6">
                <h1 class="header-skew">Fan Art Gallery</h1>
                <div class="flex items-center space-x-2">
                    <a href="../submit-fan-media.html" class="bg-yellow-500 text-white font-bold p-2 md:px-4 md:py-2 rounded-lg hover:bg-yellow-600 transition-colors flex items-center md:space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
                        <span class="hidden md:inline">Submit Art</span>
                    </a>
                    <button onclick="history.back()" class="bg-blue-700 text-white font-bold p-2 md:px-4 md:py-2 rounded-lg hover:bg-blue-800 transition-colors flex items-center md:space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>
                        <span class="hidden md:inline">Back</span>
                    </button>
                </div>
            </div>
            <!-- Art Gallery Grid -->
            <div id="art-gallery" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <p id="loading-message" class="col-span-full text-center text-gray-500 py-8">Loading fan art...</p>
            </div>
        </div>
    </main>

    <!-- Image Lightbox Modal -->
    <div id="image-lightbox" class="lightbox fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center p-4 z-50 hidden opacity-0 cursor-pointer">
        <div class="relative max-w-4xl max-h-[90vh]">
            <img id="lightbox-image" src="" alt="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">
            <div id="lightbox-info" class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-60 text-white p-3 rounded-b-lg">
                <h3 id="lightbox-title" class="font-bold text-lg"></h3>
                <p id="lightbox-author" class="text-sm opacity-80"></p>
                <p id="lightbox-desc" class="text-xs opacity-70 mt-1"></p>
            </div>
        </div>
        <button id="close-lightbox" class="absolute top-4 right-4 text-white text-3xl font-bold hover:text-yellow-400">&times;</button>
    </div>

    <!-- =================================================================== -->
    <!-- FOOTER SECTION -->
    <!-- =================================================================== -->
    <div id="site-footer"></div>

    <!-- =================================================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- =================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('art-gallery');
            const loadingMessage = document.getElementById('loading-message');
            const lightbox = document.getElementById('image-lightbox');
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxTitle = document.getElementById('lightbox-title');
            const lightboxAuthor = document.getElementById('lightbox-author');
            const lightboxDesc = document.getElementById('lightbox-desc');

            /**
             * Checks if a URL points to a direct image file.
             * Accepts URLs ending with image extensions OR any HTTPS URL that
             * looks like it could serve an image (e.g. CDN/proxy URLs without
             * file extensions like Notion, Discord, Imgur, etc.).
             * The browser will fall back via onerror if it can't render it.
             */
            function isDirectImageUrl(url) {
                try {
                    const u = new URL(url);
                    // Must be HTTP(S)
                    if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
                    // Check if the pathname ends with a known image extension
                    const pathname = u.pathname.toLowerCase();
                    if (/\.(jpg|jpeg|png|gif|webp|bmp|svg|avif|ico|tiff|tif)(\?.*)?$/i.test(pathname)) return true;
                    // For other HTTPS URLs without file extensions, try as an image —
                    // the browser will fall back via onerror if it can't render it
                    return u.protocol === 'https:';
                } catch {
                    return false;
                }
            }

            /**
             * Tries to extract a direct image URL from common platforms.
             * With the updated isDirectImageUrl, most HTTPS URLs are treated
             * as potential images. This function still handles special cases
             * like Imgur page URLs that need conversion.
             */
            function getThumbnailUrl(url) {
                // Direct image URL — use as-is
                if (isDirectImageUrl(url)) return url;

                // Imgur image page → direct image
                try {
                    const u = new URL(url);
                    if (u.hostname === 'imgur.com' || u.hostname.endsWith('.imgur.com')) {
                        const imgId = u.pathname.split('/').filter(Boolean).pop();
                        if (imgId && !imgId.includes('.')) {
                            return `https://i.imgur.com/${imgId}.jpg`;
                        }
                    }
                } catch {}

                // For non-HTTPS or invalid URLs, return null (will show as link card)
                return null;
            }

            const fetchArt = async () => {
                try {
                    const response = await fetch('/api/fan-media?type=art');
                    if (!response.ok) throw new Error('Failed to load fan art.');
                    const data = await response.json();
                    if (data.result !== 'success') throw new Error(data.message);

                    const items = data.items || [];
                    if (items.length === 0) {
                        loadingMessage.textContent = 'No fan art has been submitted yet. Be the first to share your artwork!';
                        return;
                    }

                    gallery.innerHTML = '';

                    items.forEach(item => {
                        const thumbnailUrl = getThumbnailUrl(item.url);
                        const safeTitle = DOMPurify.sanitize(item.title);
                        const safeAuthor = DOMPurify.sanitize(item.author);
                        const safeDesc = DOMPurify.sanitize(item.description);

                        if (thumbnailUrl) {
                            // Render as image card
                            const card = document.createElement('div');
                            card.className = 'art-card group block rounded-lg overflow-hidden shadow-lg cursor-pointer bg-gray-100';
                            card.innerHTML = `
                                <div class="relative overflow-hidden">
                                    <img src="${thumbnailUrl}" alt="${safeTitle}" class="w-full object-cover aspect-[9/16] group-hover:scale-110 transition-transform duration-300" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/500x700/FBBF24/ffffff?text=Image+Unavailable';">
                                </div>
                                <div class="p-3 bg-gray-50">
                                    <h3 class="font-bold text-base text-gray-800 truncate group-hover:text-yellow-600">${safeTitle}</h3>
                                    <p class="text-sm text-gray-500">by ${safeAuthor}</p>
                                </div>
                            `;
                            card.addEventListener('click', () => {
                                if (isDirectImageUrl(item.url) || thumbnailUrl) {
                                    openLightbox(thumbnailUrl || item.url, safeTitle, safeAuthor, safeDesc);
                                } else {
                                    window.open(item.url, '_blank', 'noopener');
                                }
                            });
                            gallery.appendChild(card);
                        } else {
                            // Render as link card
                            const card = document.createElement('a');
                            card.href = item.url;
                            card.target = '_blank';
                            card.rel = 'noopener noreferrer';
                            card.className = 'art-card group block rounded-lg overflow-hidden shadow-lg bg-gray-100 hover:shadow-xl transition-shadow';
                            card.innerHTML = `
                                <div class="flex items-center justify-center aspect-[9/16] bg-gradient-to-br from-yellow-100 to-yellow-200 p-6 text-center">
                                    <div>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto text-yellow-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                        <p class="text-sm text-yellow-700 font-medium">View on external site</p>
                                    </div>
                                </div>
                                <div class="p-3 bg-gray-50">
                                    <h3 class="font-bold text-base text-gray-800 truncate group-hover:text-yellow-600">${safeTitle}</h3>
                                    <p class="text-sm text-gray-500">by ${safeAuthor}</p>
                                </div>
                            `;
                            gallery.appendChild(card);
                        }
                    });

                } catch (error) {
                    console.error('Error fetching fan art:', error);
                    loadingMessage.textContent = 'Could not load fan art. Please try again later.';
                    loadingMessage.classList.add('text-red-500');
                }
            };

            // --- Lightbox ---
            function openLightbox(imgUrl, title, author, desc) {
                lightboxImage.src = imgUrl;
                lightboxTitle.textContent = title;
                lightboxAuthor.textContent = `by ${author}`;
                lightboxDesc.textContent = desc;
                lightbox.classList.remove('hidden');
                setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
            }

            function closeLightbox() {
                lightbox.classList.add('opacity-0');
                setTimeout(() => {
                    lightbox.classList.add('hidden');
                    lightboxImage.src = '';
                }, 300);
            }

            document.getElementById('close-lightbox').addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            fetchArt();
        });
    </script>

    <script src="/js/nav-overlay.js"></script>
<script src="/js/auth.js"></script>
