    <!-- Writing Detail Modal -->
    <div id="writing-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">

            <div id="modal-body" class="p-6 md:p-8 overflow-y-auto prose max-w-none">
                <!-- Content will be injected here -->
            </div>
            <div class="p-4 bg-gray-50 border-t text-right">
                 <button id="close-writing-modal" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700">Close</button>

        </div>

    <!-- =================================================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- =================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Writings Gallery Logic ---
            const writingsList = document.getElementById('writings-list');
            const loadingMessage = document.getElementById('loading-message');
            const modal = document.getElementById('writing-modal');
            const modalBody = document.getElementById('modal-body');
            const closeModalButton = document.getElementById('close-writing-modal');

            // Cloudflare Workers API endpoint (relative path — same domain as the site)
            const apiUrl = '/api/writings';

            const fetchWritings = async () => {
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error('Failed to load writings.');
                    
                    const data = await response.json();
                    if (data.result !== 'success') throw new Error(data.message);
                    
                    const writings = data.writings || [];

                    if (writings.length === 0) {
                        loadingMessage.textContent = 'No articles are available at the moment. Why not write one?';
                        return;
                    }
                    
                    writingsList.innerHTML = ''; // Clear loading message

                    // Sort writings by most recent first
                    writings.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    writings.forEach(writing => {
                        const card = document.createElement('a');
                        card.href = '#';
                        card.className = 'group block p-6 bg-gray-50 rounded-lg shadow-md hover:shadow-lg transition-shadow';
                        // Sanitize user-submitted data before injecting into DOM to prevent XSS
                        const safeTitle = DOMPurify.sanitize(writing.title);
                        const safeAuthor = DOMPurify.sanitize(writing.author);
                        const safePreview = DOMPurify.sanitize(writing.content.substring(0, 150));
                        card.innerHTML = `
                            <h3 class="font-bold text-xl text-gray-800 group-hover:text-blue-600">${safeTitle}</h3>
                            <p class="text-sm text-gray-500 mt-1">by ${safeAuthor}</p>
                            <p class="mt-4 text-sm text-gray-600 italic">"${safePreview}..."</p>
                        `;
                        card.addEventListener('click', (e) => {
                            e.preventDefault();
                            showModal(writing);
                        });
                        writingsList.appendChild(card);
                    });

                } catch (error) {
                    console.error('Error fetching writings:', error);
                    loadingMessage.textContent = 'Could not load articles. Please try again later.';
                    loadingMessage.classList.add('text-red-500');
                }
            };

            const showModal = (writing) => {
                const converter = new showdown.Converter();
                const rawHtml = converter.makeHtml(writing.content);
                // Sanitize the Markdown-generated HTML to strip any injected <script> or event handlers
                const safeHtmlContent = DOMPurify.sanitize(rawHtml);
                const safeTitle = DOMPurify.sanitize(writing.title);
                const safeAuthor = DOMPurify.sanitize(writing.author);

                modalBody.innerHTML = `
                    <h1 class="text-3xl font-bold mb-2">${safeTitle}</h1>
                    <p class="text-sm text-gray-500 mb-6">By ${safeAuthor} on ${new Date(writing.timestamp).toLocaleDateString()}</p>
                    <div class="prose max-w-none">${safeHtmlContent}</div>
                `;
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('.modal-content').classList.remove('scale-95');
                }, 10);
            };

            const hideModal = () => {
                modal.classList.add('opacity-0');
                modal.querySelector('.modal-content').classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            closeModalButton.addEventListener('click', hideModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    hideModal();
                }
            });

            fetchWritings();
        });
    </script>
