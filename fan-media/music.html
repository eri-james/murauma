                <div class="flex items-center space-x-2">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>

    <!-- =================================================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- =================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('music-gallery');
            const loadingMessage = document.getElementById('loading-message');

            /**
             * Detects if a URL is a Spotify link and returns embed URL.
             */
            function getSpotifyEmbedUrl(url) {
                try {
                    const u = new URL(url);
                    if (u.hostname === 'open.spotify.com') {
                        // e.g. open.spotify.com/track/XXX or open.spotify.com/album/XXX
                        const parts = u.pathname.split('/').filter(Boolean);
                        if (parts.length >= 2) {
                            const type = parts[0]; // track, album, playlist
                            const id = parts[1].split('?')[0];
                            return `https://open.spotify.com/embed/${type}/${id}?utm_source=generator&theme=0`;
                        }
                    }
                } catch {}
                return null;
            }

            /**
             * Detects if a URL is a SoundCloud link and returns embed URL.
             */
            function getSoundCloudEmbedUrl(url) {
                try {
                    const u = new URL(url);
                    if (u.hostname === 'soundcloud.com' || u.hostname.endsWith('.soundcloud.com')) {
                        return `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%2310b981&auto_play=false&hide_related=true&show_comments=true&show_user=true&show_reposts=false&show_teaser=false&visual=true`;
                    }
                } catch {}
                return null;
            }

            /**
             * Detects if a URL is a YouTube link and returns embed URL (for music videos).
             */
            function getYouTubeEmbedUrl(url) {
                try {
                    const u = new URL(url);
                    if (u.hostname.includes('youtube.com') && u.searchParams.get('v')) {
                        return `https://www.youtube.com/embed/${u.searchParams.get('v')}`;
                    }
                    if (u.hostname === 'youtu.be') {
                        return `https://www.youtube.com/embed/${u.pathname.slice(1).split('/')[0].split('?')[0]}`;
                    }
                } catch {}
                return null;
            }

            const fetchMusic = async () => {
                try {
                    const response = await fetch('/api/fan-media?type=music');
                    if (!response.ok) throw new Error('Failed to load music.');
                    const data = await response.json();
                    if (data.result !== 'success') throw new Error(data.message);

                    const items = data.items || [];
                    if (items.length === 0) {
                        loadingMessage.textContent = 'No music has been submitted yet. Be the first to share your music!';
                        return;
                    }

                    gallery.innerHTML = '';

                    items.forEach(item => {
                        const safeTitle = DOMPurify.sanitize(item.title);
                        const safeAuthor = DOMPurify.sanitize(item.author);
                        const safeDesc = DOMPurify.sanitize(item.description);

                        const card = document.createElement('div');
                        card.className = 'bg-gray-50 rounded-lg shadow-md overflow-hidden p-4 md:p-6';

                        // Check for embeddable URLs
                        const spotifyEmbed = getSpotifyEmbedUrl(item.url);
                        const soundcloudEmbed = getSoundCloudEmbedUrl(item.url);
                        const youtubeEmbed = getYouTubeEmbedUrl(item.url);

                        let embedHtml = '';

                        if (spotifyEmbed) {
                            embedHtml = `<iframe src="${spotifyEmbed}" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" class="rounded-lg"></iframe>`;
                        } else if (soundcloudEmbed) {
                            embedHtml = `<iframe src="${soundcloudEmbed}" width="100%" height="166" frameBorder="0" allowfullscreen="" allow="autoplay" loading="lazy" class="rounded-lg"></iframe>`;
                        } else if (youtubeEmbed) {
                            embedHtml = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.5rem;"><iframe src="${youtubeEmbed}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
                        } else {
                            // Generic link card
                            embedHtml = `
                                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-4 p-4 bg-white rounded-lg border border-gray-200 hover:border-green-400 hover:shadow-md transition-all group">
                                    <div class="flex-shrink-0 w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 16 16"><path d="M6 13c0 1.105-1.12 2-2.5 2S1 14.105 1 13c0-1.104 1.12-2 2.5-2s2.5.896 2.5 2zm9-2c0 1.105-1.12 2-2.5 2s-2.5-.895-2.5-2 1.12-2 2.5-2 2.5.895 2.5 2z"/><path fill-rule="evenodd" d="M14 11V2h1v9h-1zM6 3v10H5V3h1z"/><path d="M5 2.905a1 1 0 0 1 .9-.995l8-.8a1 1 0 0 1 1.1.995V3L5 4V2.905z"/></svg>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="font-bold text-gray-800 group-hover:text-green-600 truncate">${safeTitle}</p>
                                        <p class="text-sm text-gray-500">Listen on external site</p>
                                    </div>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 group-hover:text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                </a>
                            `;
                        }

                        card.innerHTML = `
                            ${embedHtml}
                            <div class="mt-3">
                                <h3 class="font-bold text-lg text-gray-800">${safeTitle}</h3>
                                <p class="text-sm text-gray-500">by ${safeAuthor}</p>
                                ${safeDesc ? `<p class="text-sm text-gray-600 mt-1">${safeDesc}</p>` : ''}
                            </div>
                        `;

                        gallery.appendChild(card);
                    });

                } catch (error) {
                    console.error('Error fetching music:', error);
                    loadingMessage.textContent = 'Could not load music. Please try again later.';
                    loadingMessage.classList.add('text-red-500');
                }
            };

            fetchMusic();
        });
    </script>
