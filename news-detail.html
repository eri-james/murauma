    <style>
        /* News content styling (Quill output) */
        .news-content h1 { font-size: 2rem; font-weight: 800; margin: 1.5rem 0 0.75rem; }
        .news-content h2 { font-size: 1.5rem; font-weight: 700; margin: 1.25rem 0 0.5rem; }
        .news-content h3 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .news-content p { margin: 0.75rem 0; line-height: 1.7; }
        .news-content ul, .news-content ol { margin: 0.75rem 0; padding-left: 1.5rem; }
        .news-content li { margin: 0.25rem 0; line-height: 1.6; }
        .news-content blockquote { border-left: 4px solid #ec4899; padding: 0.5rem 1rem; margin: 1rem 0; background: #fdf2f8; border-radius: 0.25rem; }
        .news-content pre { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
        .news-content code { background: #f3f4f6; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .news-content pre code { background: none; padding: 0; }
        .news-content img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
        .news-content a { color: #ec4899; text-decoration: underline; }
        .news-content a:hover { color: #db2777; }
        .news-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .news-content th, .news-content td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
        .news-content th { background: #f9fafb; font-weight: 700; }
        .news-content iframe, .news-content .ql-video { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; aspect-ratio: 16/9; width: 100%; }
    </style>
</head>
<body class="has-pill-nav">

    <div id="site-nav"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white p-6 md:p-12 rounded-lg shadow-md border-2 border-pink-500 max-w-4xl mx-auto">
            <!-- Loading -->
            <div id="loading" class="text-center py-12 text-gray-500">Loading news...</div>

            <!-- News listing (no slug — shows all news) -->
            <div id="news-listing" class="hidden">
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2">News</h1>
                <p class="text-base text-gray-500 mb-6">All the latest updates and announcements from MURA.</p>
                <div id="news-listing-grid" class="grid md:grid-cols-2 gap-4"></div>
                <div id="news-listing-empty" class="hidden text-center py-12">
                    <p class="text-gray-400 text-lg">No news posts yet.</p>
                </div>
            </div>

            <!-- News content (hidden until loaded) -->
            <div id="news-content" class="hidden">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span id="news-category" class="inline-block bg-pink-500 text-white text-xs font-bold px-3 py-1 rounded-full mb-3 uppercase tracking-wide"></span>
                        <h1 id="news-title" class="text-3xl font-extrabold text-gray-800"></h1>
                        <p class="text-sm text-gray-500 mt-2"><span id="news-date"></span></p>
                    </div>
                    <a href="news-detail.html" class="bg-blue-700 text-white font-bold p-2 md:px-4 md:py-2 rounded-lg hover:bg-blue-800 transition-colors flex items-center md:space-x-2 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>
                        <span class="hidden md:inline">All News</span>
                    </a>
                </div>

                <!-- Hero image -->
                <div id="news-image-container" class="hidden mb-6">
                    <img id="news-image" class="w-full rounded-lg shadow-md" alt="">
                </div>

                <!-- Description (subtitle) -->
                <p id="news-description" class="text-lg text-gray-600 font-medium mb-6 leading-relaxed"></p>

                <!-- News body -->
                <div id="news-body" class="news-content"></div>
            </div>

            <!-- Error state -->
            <div id="error-state" class="hidden text-center py-12">
                <p class="text-red-600 font-bold text-lg">News post not found.</p>
                <a href="news-detail.html" class="mt-4 inline-block text-pink-600 font-bold hover:underline">Back to News</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        // Decode HTML entities from server-side sanitizeText() for existing data
        function decodeHTMLEntities(text) {
            if (!text || typeof text !== 'string') return text;
            const el = document.createElement('textarea');
            el.innerHTML = text;
            return el.value;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) {
                // Show news listing
                try {
                    const resp = await fetch('/api/news');
                    const data = await resp.json();
                    document.getElementById('loading').classList.add('hidden');

                    if (data.result !== 'success' || !data.news || data.news.length === 0) {
                        document.getElementById('news-listing-empty').classList.remove('hidden');
                        document.getElementById('news-listing').classList.remove('hidden');
                        return;
                    }

                    const grid = document.getElementById('news-listing-grid');
                    grid.innerHTML = data.news.map(item => {
                        const img = item.imageUrl
                            ? `<img src="${DOMPurify.sanitize(item.imageUrl)}" alt="${DOMPurify.sanitize(decodeHTMLEntities(item.title))}" class="w-full rounded-lg mb-3 object-cover aspect-video" loading="lazy" onerror="this.style.display='none'">`
                            : '';
                        const cat = item.category
                            ? `<span class="inline-block bg-pink-500 text-white text-xs font-bold px-2 py-0.5 rounded-full mb-2 uppercase tracking-wide">${DOMPurify.sanitize(decodeHTMLEntities(item.category))}</span>`
                            : '';
                        const date = item.createdAt
                            ? `<p class="text-gray-400 text-xs mt-2">${new Date(item.createdAt).toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' })}</p>`
                            : '';
                        const desc = item.description
                            ? `<p class="text-gray-500 text-sm mt-2 line-clamp-2">${DOMPurify.sanitize(decodeHTMLEntities(item.description))}</p>`
                            : '';
                        return `<a href="news-detail.html?slug=${encodeURIComponent(item.slug)}" class="block bg-gray-50 p-4 rounded-lg border-2 border-gray-200 hover:border-pink-400 transition-colors">
                            ${img}
                            ${cat}
                            <h3 class="font-bold text-lg text-gray-800">${DOMPurify.sanitize(decodeHTMLEntities(item.title))}</h3>
                            ${date}
                            ${desc}
                        </a>`;
                    }).join('');

                    document.getElementById('news-listing').classList.remove('hidden');
                } catch (err) {
                    console.error('Error loading news listing:', err);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error-state').classList.remove('hidden');
                }
                return;
            }

            try {
                const response = await fetch(`/api/news?slug=${encodeURIComponent(slug)}`);
                if (!response.ok) throw new Error('Failed to load news.');
                const data = await response.json();
                if (data.result !== 'success' || !data.news) throw new Error('News not found.');

                const news = data.news;

                // Update page title
                document.title = `${news.title} - MURA`;

                // Fill in content
                document.getElementById('news-title').textContent = decodeHTMLEntities(news.title);
                document.getElementById('news-category').textContent = decodeHTMLEntities(news.category);
                document.getElementById('news-description').textContent = decodeHTMLEntities(news.description) || '';
                document.getElementById('news-date').textContent = new Date(news.createdAt).toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' });
                // Sanitize then decode apostrophe entities that DOMPurify may encode
                document.getElementById('news-body').innerHTML = DOMPurify.sanitize(news.content || '').replace(/&#x27;|&#39;/g, "'");

                // Gracefully hide any broken images embedded in the rich text body
                document.querySelectorAll('#news-body img').forEach(img => {
                    img.onerror = function() { this.style.display = 'none'; };
                });

                // Show hero image if available
                if (news.imageUrl) {
                    const imgEl = document.getElementById('news-image');
                    imgEl.src = news.imageUrl;
                    imgEl.alt = news.title;
                    imgEl.onerror = function() {
                        // Hide the broken image container gracefully
                        document.getElementById('news-image-container').classList.add('hidden');
                    };
                    document.getElementById('news-image-container').classList.remove('hidden');
                }

                // Show/hide elements
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('news-content').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        });
    </script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav-overlay.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/particles.js"></script>
</body>
</html>
