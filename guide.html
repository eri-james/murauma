    <style>
        /* Guide content styling (Quill output) */
        .guide-content h1 { font-size: 2rem; font-weight: 800; margin: 1.5rem 0 0.75rem; }
        .guide-content h2 { font-size: 1.5rem; font-weight: 700; margin: 1.25rem 0 0.5rem; }
        .guide-content h3 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .guide-content p { margin: 0.75rem 0; line-height: 1.7; }
        .guide-content ul, .guide-content ol { margin: 0.75rem 0; padding-left: 1.5rem; }
        .guide-content li { margin: 0.25rem 0; line-height: 1.6; }
        .guide-content blockquote { border-left: 4px solid #a78bfa; padding: 0.5rem 1rem; margin: 1rem 0; background: #f5f3ff; border-radius: 0.25rem; }
        .guide-content pre { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
        .guide-content code { background: #f3f4f6; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .guide-content pre code { background: none; padding: 0; }
        .guide-content img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
        .guide-content a { color: #7c3aed; text-decoration: underline; }
        .guide-content a:hover { color: #6d28d9; }
        .guide-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .guide-content th, .guide-content td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
        .guide-content th { background: #f9fafb; font-weight: 700; }
        .guide-content iframe, .guide-content .ql-video { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; aspect-ratio: 16/9; width: 100%; }
        /* Vote buttons */
        .vote-btn { transition: transform 0.15s ease, color 0.15s ease; }
        .vote-btn:hover { transform: scale(1.2); }
        .vote-btn.upvoted { color: #f97316; }
        .vote-btn.downvoted { color: #3b82f6; }
    </style>
</head>
<body class="has-pill-nav">

    <div id="site-nav"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white p-6 md:p-12 rounded-lg shadow-md border-2 border-purple-500 max-w-4xl mx-auto">
            <!-- Loading -->
            <div id="loading" class="text-center py-12 text-gray-500">Loading guide...</div>

            <!-- Guide content (hidden until loaded) -->
            <div id="guide-content" class="hidden">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h1 id="guide-title" class="text-3xl font-extrabold text-gray-800"></h1>
                        <p class="text-sm text-gray-500 mt-2">by <span id="guide-author"></span> | <span id="guide-date"></span></p>
                    </div>
                    <a href="guides.html" class="bg-blue-700 text-white font-bold p-2 md:px-4 md:py-2 rounded-lg hover:bg-blue-800 transition-colors flex items-center md:space-x-2 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>
                        <span class="hidden md:inline">All Guides</span>
                    </a>
                </div>

                <!-- Vote bar -->
                <div class="flex items-center space-x-3 mb-6 p-3 bg-gray-50 rounded-lg">
                    <button id="upvote-btn" class="vote-btn text-gray-400" title="Upvote">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
                    </button>
                    <span id="vote-score" class="font-bold text-xl text-gray-700 min-w-[2rem] text-center">0</span>
                    <button id="downvote-btn" class="vote-btn text-gray-400" title="Downvote">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <span id="vote-login-hint" class="text-xs text-gray-400 hidden">Log in to vote</span>
                </div>

                <!-- Guide body -->
                <div id="guide-body" class="guide-content"></div>
            </div>

            <!-- Error state -->
            <div id="error-state" class="hidden text-center py-12">
                <p class="text-red-600 font-bold text-lg">Guide not found.</p>
                <a href="guides.html" class="mt-4 inline-block text-purple-600 font-bold hover:underline">Browse all guides</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const id = urlParams.get('id');

            if (!slug && !id) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
                return;
            }

            let guideId = null;
            let currentUserVote = 0;

            const upvoteBtn = document.getElementById('upvote-btn');
            const downvoteBtn = document.getElementById('downvote-btn');
            const voteScore = document.getElementById('vote-score');
            const voteLoginHint = document.getElementById('vote-login-hint');

            try {
                const apiUrl = slug ? `/api/guides?slug=${encodeURIComponent(slug)}` : `/api/guides?id=${id}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to load guide.');
                const data = await response.json();
                if (data.result !== 'success' || !data.guide) throw new Error('Guide not found.');

                const guide = data.guide;
                guideId = guide.id;
                currentUserVote = guide.userVote || 0;

                // Update page title
                document.title = `${guide.title} - MURA`;

                // Fill in content
                document.getElementById('guide-title').textContent = decodeHTMLEntities(guide.title);
                document.getElementById('guide-author').textContent = decodeHTMLEntities(guide.author);
                document.getElementById('guide-date').textContent = new Date(guide.createdAt).toLocaleDateString();
                // Sanitize then decode apostrophe entities that DOMPurify may encode
                document.getElementById('guide-body').innerHTML = DOMPurify.sanitize(guide.content).replace(/&#x27;|&#39;/g, "'");
                voteScore.textContent = guide.voteScore || 0;

                // Show/hide elements
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('guide-content').classList.remove('hidden');

                // Set up vote buttons
                updateVoteUI();

                // Check if user is logged in for voting
                if (!window.muraCurrentUser) {
                    voteLoginHint.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error loading guide:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }

            function updateVoteUI() {
                upvoteBtn.classList.remove('upvoted');
                downvoteBtn.classList.remove('downvoted');
                if (currentUserVote === 1) upvoteBtn.classList.add('upvoted');
                if (currentUserVote === -1) downvoteBtn.classList.add('downvoted');
            }

            async function handleVote(vote) {
                if (!window.muraCurrentUser) {
                    alert('Please log in to vote.');
                    return;
                }
                if (!guideId) return;

                // Toggle: clicking same vote removes it
                const newVote = (currentUserVote === vote) ? 0 : vote;

                try {
                    const resp = await fetch('/api/guides/vote', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ guideId, vote: newVote }),
                    });
                    const result = await resp.json();
                    if (result.result === 'success') {
                        currentUserVote = newVote;
                        voteScore.textContent = result.score || 0;
                        updateVoteUI();
                    }
                } catch (err) {
                    console.error('Vote error:', err);
                }
            }

            upvoteBtn.addEventListener('click', () => handleVote(1));
            downvoteBtn.addEventListener('click', () => handleVote(-1));
        });
    </script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav-overlay.js"></script>
<script src="/js/auth.js"></script>
    <script>
        // Decode HTML entities from server-side sanitizeText() for existing data
        function decodeHTMLEntities(text) {
            if (!text || typeof text !== 'string') return text;
            const el = document.createElement('textarea');
            el.innerHTML = text;
            return el.value;
        }

    </script>
<script src="/js/particles.js"></script>
</body>
</html>
