    <script src="/js/dompurify-fallback.js"></script>

    <link rel="stylesheet" href="/css/fonts.css">

    <style>
        /* Event content styling (Quill output) */
        .event-content h1 { font-size: 2rem; font-weight: 800; margin: 1.5rem 0 0.75rem; }
        .event-content h2 { font-size: 1.5rem; font-weight: 700; margin: 1.25rem 0 0.5rem; }
        .event-content h3 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .event-content p { margin: 0.75rem 0; line-height: 1.7; }
        .event-content ul, .event-content ol { margin: 0.75rem 0; padding-left: 1.5rem; }
        .event-content li { margin: 0.25rem 0; line-height: 1.6; }
        .event-content blockquote { border-left: 4px solid #ef4444; padding: 0.5rem 1rem; margin: 1rem 0; background: #fef2f2; border-radius: 0.25rem; }
        .event-content pre { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
        .event-content code { background: #f3f4f6; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .event-content pre code { background: none; padding: 0; }
        .event-content img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
        .event-content a { color: #ef4444; text-decoration: underline; }
        .event-content a:hover { color: #dc2626; }
        .event-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .event-content th, .event-content td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
        .event-content th { background: #f9fafb; font-weight: 700; }
        .event-content iframe, .event-content .ql-video { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; aspect-ratio: 16/9; width: 100%; }
    </style>
</head>
<body class="has-pill-nav">

    <div id="site-nav"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white p-6 md:p-12 rounded-lg shadow-md border-2 border-red-500 max-w-4xl mx-auto">
            <!-- Loading -->
            <div id="loading" class="text-center py-12 text-gray-500">Loading event...</div>

            <!-- Events listing (no slug — shows all events) -->
            <div id="event-listing" class="hidden">
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2">Events</h1>
                <p class="text-base text-gray-500 mb-6">Browse upcoming and past MURA events.</p>
                <div id="event-listing-grid" class="grid md:grid-cols-2 gap-4"></div>
                <div id="event-listing-empty" class="hidden text-center py-12">
                    <p class="text-gray-400 text-lg">No events yet.</p>
                </div>
            </div>

            <!-- Event content (hidden until loaded) -->
            <div id="event-content" class="hidden">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h1 id="event-title" class="text-3xl font-extrabold text-gray-800"></h1>
                        <p class="text-sm text-gray-500 mt-2">
                            <span id="event-start-date"></span>
                            <span id="event-end-date-wrap" class="hidden"> - <span id="event-end-date"></span></span>
                        </p>
                    </div>
                    <a href="event-detail.html" class="bg-blue-700 text-white font-bold p-2 md:px-4 md:py-2 rounded-lg hover:bg-blue-800 transition-colors flex items-center md:space-x-2 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>
                        <span class="hidden md:inline">All Events</span>
                    </a>
                </div>

                <!-- Hero image -->
                <div id="event-image-container" class="hidden mb-6">
                    <img id="event-image" class="w-full rounded-lg shadow-md" alt="">
                </div>

                <!-- Description -->
                <p id="event-description" class="text-lg text-gray-600 font-medium mb-6 leading-relaxed"></p>

                <!-- Event body -->
                <div id="event-body" class="event-content"></div>
            </div>

            <!-- Error state -->
            <div id="error-state" class="hidden text-center py-12">
                <p class="text-red-600 font-bold text-lg">Event not found.</p>
                <a href="event-detail.html" class="mt-4 inline-block text-red-600 font-bold hover:underline">Back to Events</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        // Decode HTML entities from server-side sanitizeText() for existing data
        function decodeHTMLEntities(text) {
            if (!text || typeof text !== 'string') return text;
            const el = document.createElement('textarea');
            el.innerHTML = text;
            return el.value;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) {
                // Show events listing
                try {
                    const resp = await fetch('/api/events');
                    const data = await resp.json();
                    document.getElementById('loading').classList.add('hidden');

                    if (data.result !== 'success' || !data.events || data.events.length === 0) {
                        document.getElementById('event-listing-empty').classList.remove('hidden');
                        document.getElementById('event-listing').classList.remove('hidden');
                        return;
                    }

                    const grid = document.getElementById('event-listing-grid');
                    grid.innerHTML = data.events.map(item => {
                        const img = item.imageUrl
                            ? `<img src="${DOMPurify.sanitize(item.imageUrl)}" alt="${DOMPurify.sanitize(decodeHTMLEntities(item.title))}" class="w-full rounded-lg mb-3 object-cover aspect-video" loading="lazy" onerror="this.style.display='none'">`
                            : '';
                        const dateStr = item.startDate
                            ? `<p class="text-gray-600 text-sm"><strong>${new Date(item.startDate).toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' })}</strong></p>`
                            : '';
                        const endDateStr = item.endDate
                            ? `<p class="text-gray-400 text-xs">until ${new Date(item.endDate).toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' })}</p>`
                            : '';
                        const desc = item.description
                            ? `<p class="text-gray-500 text-sm mt-2 line-clamp-2">${DOMPurify.sanitize(decodeHTMLEntities(item.description))}</p>`
                            : '';
                        return `<a href="event-detail.html?slug=${encodeURIComponent(item.slug)}" class="block bg-gray-50 p-4 rounded-lg border-2 border-gray-200 hover:border-red-400 transition-colors">
                            ${img}
                            <h3 class="font-bold text-lg text-gray-800">${DOMPurify.sanitize(decodeHTMLEntities(item.title))}</h3>
                            ${dateStr}
                            ${endDateStr}
                            ${desc}
                        </a>`;
                    }).join('');

                    document.getElementById('event-listing').classList.remove('hidden');
                } catch (err) {
                    console.error('Error loading events listing:', err);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error-state').classList.remove('hidden');
                }
                return;
            }

            try {
                const response = await fetch(`/api/events?slug=${encodeURIComponent(slug)}`);
                if (!response.ok) throw new Error('Failed to load event.');
                const data = await response.json();
                if (data.result !== 'success' || !data.event) throw new Error('Event not found.');

                const event = data.event;

                // Update page title
                document.title = `${event.title} - MURA`;

                // Fill in content
                document.getElementById('event-title').textContent = decodeHTMLEntities(event.title);
                document.getElementById('event-description').textContent = decodeHTMLEntities(event.description) || '';

                // Format dates
                if (event.startDate) {
                    document.getElementById('event-start-date').textContent = new Date(event.startDate).toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' });
                }
                if (event.endDate) {
                    document.getElementById('event-end-date').textContent = new Date(event.endDate).toLocaleDateString('en-MY', { year: 'numeric', month: 'long', day: 'numeric' });
                    document.getElementById('event-end-date-wrap').classList.remove('hidden');
                }

                // Sanitize then decode apostrophe entities that DOMPurify may encode
                document.getElementById('event-body').innerHTML = DOMPurify.sanitize(event.content || '').replace(/&#x27;|&#39;/g, "'");

                // Gracefully hide any broken images embedded in the rich text body
                document.querySelectorAll('#event-body img').forEach(img => {
                    img.onerror = function() { this.style.display = 'none'; };
                });

                // Show hero image if available
                if (event.imageUrl) {
                    const imgEl = document.getElementById('event-image');
                    imgEl.src = event.imageUrl;
                    imgEl.alt = event.title;
                    imgEl.onerror = function() {
                        document.getElementById('event-image-container').classList.add('hidden');
                    };
                    document.getElementById('event-image-container').classList.remove('hidden');
                }

                // Show/hide elements
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('event-content').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading event:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        });
    </script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav-overlay.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/particles.js"></script>
</body>
</html>
