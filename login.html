<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="YyHtpyC4Qyd60TqjjYi8FO5eyCKZ4stbpYFTrDBIKeQ" />
    <title>Login — MURA</title>
    <meta name="description" content="Log in to your MURA member account.">
    <link rel="canonical" href="https://murauma.pages.dev/login.html">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png" sizes="180x180">
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="has-pill-nav">

    <div id="site-nav"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white p-6 md:p-12 rounded-lg shadow-md border-2 border-blue-500 max-w-md mx-auto">
            
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Welcome Back</h1>
            <p class="text-base text-gray-600 mb-8">Log in to your MURA account.</p>

            <form id="login-form" class="space-y-6">
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" name="username" id="username" required autocomplete="username"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" name="password" id="password" required autocomplete="current-password"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button id="submit-button" type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Log In
                    </button>
                </div>
            </form>

            <!-- Status Message Area -->
            <div id="status-message" class="mt-6 text-center"></div>

            <!-- Links -->
            <div class="mt-8 space-y-3 text-center">
                <p class="text-sm text-gray-600">
                    Don't have an account? 
                    <a href="register.html" class="font-medium text-blue-600 hover:text-blue-800">Register here</a>
                </p>
                <p class="text-sm text-gray-600">
                    Registered before but can't log in?
                    <a href="setup-account.html" class="font-medium text-blue-600 hover:text-blue-800">Set up your account</a>
                </p>
            </div>

            <!-- Back Button -->
            <div class="mt-8 text-center">
                <a href="index.html" class="text-blue-700 hover:text-blue-800 font-medium inline-flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>
                    <span>Back to Main Site</span>
                </a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const submitButton = document.getElementById('submit-button');
            const statusMessage = document.getElementById('status-message');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    submitButton.disabled = true;
                    submitButton.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>';
                    statusMessage.textContent = '';

                    try {
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: document.getElementById('username').value,
                                password: document.getElementById('password').value,
                            }),
                        });

                        const data = await response.json();

                        if (data.result === 'success') {
                            const isPending = data.user && data.user.status === 'pending';
                            if (isPending) {
                                statusMessage.innerHTML = '<p class="text-green-600 font-bold">Logged in!</p><p class="text-sm text-amber-600 mt-1">Your membership is pending admin approval. You can edit your profile, but content submission requires approval first.</p>';
                            } else {
                                statusMessage.innerHTML = '<p class="text-green-600 font-bold">Logged in! Redirecting...</p>';
                            }
                            setTimeout(() => {
                                window.location.href = 'edit-profile.html';
                            }, isPending ? 3000 : 1000);
                        } else {
                            statusMessage.innerHTML = `<p class="text-red-600 font-bold">${data.message || 'Login failed.'}</p>`;
                            submitButton.disabled = false;
                            submitButton.textContent = 'Log In';
                        }
                    } catch (err) {
                        console.error('Login error:', err);
                        statusMessage.innerHTML = '<p class="text-red-600 font-bold">A network error occurred. Please try again.</p>';
                        submitButton.disabled = false;
                        submitButton.textContent = 'Log In';
                    }
                });
            }
        });
    </script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav-overlay.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/particles.js"></script>
</body>
</html>
